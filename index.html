<!doctype html>
<html lang="pt-BR">
<head>
<title>Atlas de Medicina</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1B33">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: atlas por matéria. Início = plano de hoje + próxima prova + quem está online + matérias.
   Tema = figuras interativas (esq.) + resumo, esquema, mapa mental, pergunta guiada, quiz, termos e cartões (dir.).
   Cor: cada matéria tem a sua. Nas figuras: verde = estimula (+), vermelho = inibe (–), sempre com símbolo e rótulo. */
:root {
  --bg: #f5f6fb; --surface: #ffffff; --sunk: #eef0f8; --line: #e1e4f0; --ink: #14152e; --muted: #5a5f7b; --on: #ffffff;
  --vi: #6548d8; --vi-s: #ebe6fd; --gr: #108a70; --gr-s: #d7f2ea; --am: #b96d08; --am-s: #fbecd2;
  --bl: #2c62cf; --bl-s: #e0e9fc; --rs: #c0386a; --rs-s: #fbe1ec; --rd: #cc3a43; --rd-s: #fbe2e4;
  --sh: 0 1px 2px rgba(20,21,46,.05), 0 14px 34px -18px rgba(20,21,46,.25);
  --sh-s: 0 1px 2px rgba(20,21,46,.06), 0 6px 16px -10px rgba(20,21,46,.2);
  --r: 20px;
  --fd: "Plus Jakarta Sans", "Figtree", "Segoe UI", system-ui, sans-serif;
  --fb: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1020; --surface: #191a2d; --sunk: #14152b; --line: #2b2d48; --ink: #eeeef9; --muted: #a3a6c2; --on: #0f1020;
  --vi: #a590ff; --vi-s: #272049; --gr: #45cdb0; --gr-s: #12322c; --am: #f5b04f; --am-s: #362713;
  --bl: #7a9eff; --bl-s: #1a2549; --rs: #f27ea6; --rs-s: #3a1a29; --rd: #ff7078; --rd-s: #3b1a1f;
  --sh: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.7); --sh-s: 0 6px 16px -10px rgba(0,0,0,.7); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1020; --surface: #191a2d; --sunk: #14152b; --line: #2b2d48; --ink: #eeeef9; --muted: #a3a6c2; --on: #0f1020;
  --vi: #a590ff; --vi-s: #272049; --gr: #45cdb0; --gr-s: #12322c; --am: #f5b04f; --am-s: #362713;
  --bl: #7a9eff; --bl-s: #1a2549; --rs: #f27ea6; --rs-s: #3a1a29; --rd: #ff7078; --rd-s: #3b1a1f;
  --sh: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.7); --sh-s: 0 6px 16px -10px rgba(0,0,0,.7); color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 16.5px; line-height: 1.55 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
h1, h2, h3, h4 { margin: 0; font-family: var(--fd); line-height: 1.15; text-wrap: balance; letter-spacing: -.02em }
p { margin: 0 } button { font-family: inherit; color: inherit }
button:focus-visible, [tabindex]:focus-visible, summary:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--c, var(--vi)); outline-offset: 2px }
[data-m="fisiologia"] { --c: var(--vi); --cs: var(--vi-s) } [data-m="microbiologia"] { --c: var(--gr); --cs: var(--gr-s) }
[data-m="bioquimica"] { --c: var(--am); --cs: var(--am-s) } [data-m="ipc"] { --c: var(--bl); --cs: var(--bl-s) }
[data-m="profissionalismo"] { --c: var(--rs); --cs: var(--rs-s) }
#app { --c: var(--vi); --cs: var(--vi-s) }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.inner { max-width: 1120px; margin: 0 auto }
.muted { color: var(--muted) } .sm { font-size: .9rem }
.kicker { font: 700 .74rem var(--fd); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }

/* barra superior */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--line) }
.bar .inner { display: flex; align-items: center; gap: 8px; padding-block: 10px }
.brand { font: 800 .9rem var(--fd); background: none; border: 0; cursor: pointer; padding: 6px 0; display: flex; align-items: center; gap: 8px }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: conic-gradient(var(--vi) 0 20%, var(--gr) 0 40%, var(--am) 0 60%, var(--bl) 0 80%, var(--rs) 0) }
.sp { flex: 1 }
.pill { font: 600 .86rem var(--fb); border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; color: var(--ink) }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface) }
.lang { font: 800 .74rem var(--fd); border: 0; background: transparent; color: var(--muted); padding: 7px 11px; border-radius: 999px; cursor: pointer }
.lang[aria-pressed="true"] { background: var(--vi); color: var(--on) }
.btn { font: 600 .95rem var(--fb); padding: 11px 18px; border-radius: 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--sh-s); min-height: 44px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center }
.btn.solid { background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 65%, var(--rs))); color: var(--on); border-color: transparent }
.btn.ok { border-color: var(--gr); color: var(--gr); background: var(--gr-s) } .btn.miss { border-color: var(--rd); color: var(--rd); background: var(--rd-s) }
.btn.ghost { box-shadow: none; background: transparent; justify-content: center }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }

/* quem está online */
.online { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-block: 10px 0 }
.peer { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: .86rem; font-weight: 600; text-decoration: none; color: var(--ink) }
.peer img, .peer .av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; background: var(--vi-s); color: var(--vi); font: 800 .78rem var(--fd) }
.peer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gr) } .peer small { color: var(--muted); font-weight: 500 }

/* início */
.hero { padding-block: 26px 10px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start }
.hero h1 { font-size: clamp(2rem, 6vw, 3.1rem); font-weight: 800; letter-spacing: -.045em; line-height: 1.02 }
.hero h1 em { font-style: normal; background: linear-gradient(120deg, var(--vi), var(--rs)); -webkit-background-clip: text; background-clip: text; color: transparent }
.htop { display: flex; align-items: center; justify-content: space-between; gap: 12px } .htop > div:first-child { min-width: 0 }
.emb { flex: 0 0 auto; width: clamp(78px, 21vw, 128px); aspect-ratio: 3 / 4; touch-action: pan-y; cursor: grab; filter: drop-shadow(0 14px 14px rgba(20,21,46,.18)) } .emb canvas { display: block; width: 100%; height: 100% }
.plan { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px }
.plan li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 6px 16px 16px 6px; padding: 10px 14px; box-shadow: var(--sh-s) }
.plan input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--vi); flex: 0 0 auto }
.plan label { flex: 1; min-width: 0; font-weight: 600 } .plan li.done label { text-decoration: line-through; color: var(--muted) }
.plan a { font-size: .86rem; font-weight: 700; color: var(--c); white-space: nowrap }
.exam { background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 60%, var(--rs))); color: var(--on); border-radius: 28px; padding: 22px; box-shadow: var(--sh); display: flex; flex-direction: column; gap: 6px }
.exam .kicker { color: inherit; opacity: .85 }
.exam .count { font: 800 clamp(2rem, 7.5vw, 3rem)/1 var(--fd); letter-spacing: -.04em; font-variant-numeric: tabular-nums }
.sec { padding-block: 30px 4px; display: flex; flex-direction: column; gap: 14px }
.sec > h2 { font-size: 1.3rem; font-weight: 800 }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column }
.tl li { display: grid; grid-template-columns: 5.2em 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.tl .d { font: 700 .92rem var(--fd); font-variant-numeric: tabular-nums } .tl .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c) }
.tl .in { font-weight: 700; font-size: .85rem; color: var(--c); font-variant-numeric: tabular-nums; white-space: nowrap }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; box-shadow: var(--sh-s); min-width: 0; transition: transform .15s, box-shadow .15s, border-color .15s }
.tile::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c) }
.tile:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--c); box-shadow: 0 16px 34px -18px var(--c) }
.tile .num { font: 800 .78rem var(--fd); color: var(--c) } .tile .tt { font: 700 1.05rem/1.25 var(--fd) } .tile .ts { font-size: .9rem; color: var(--muted); line-height: 1.4 }
.tile.done { background: linear-gradient(180deg, var(--cs), var(--surface) 70%) }
.tile:disabled, .tile.empty { cursor: default; border-style: dashed; box-shadow: none; background: transparent } .tile.empty::before, .tile:disabled::before { opacity: .35 }
.badge { align-self: flex-start; font: 700 .7rem var(--fd); letter-spacing: .04em; padding: 3px 9px; border-radius: 99px; background: var(--cs); color: var(--c) }
.badge.todo { background: var(--sunk); color: var(--muted) } .badge.part { background: var(--am-s); color: var(--am) }
.track { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden } .track i { display: block; height: 100%; border-radius: 99px; background: var(--c) }
input.txt { font: inherit; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; min-width: 0; flex: 1 1 180px }

/* matéria */
.mhead { padding-block: 26px 4px; display: flex; flex-direction: column; gap: 10px }
.mhead h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -.04em }
.mstat { margin: 0; font-size: .95rem; color: var(--muted) } .mstat b { color: var(--ink) }
.btn.cta { justify-content: space-between; gap: 12px; width: 100%; max-width: 460px; text-align: left; margin-top: 2px } .btn.cta > span:first-child { display: flex; flex-direction: column; min-width: 0 } .btn.cta small { font: 700 .7rem var(--fd); letter-spacing: .08em; text-transform: uppercase; opacity: .85 } .btn.cta b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sheet .sum .sum-in { margin-top: 0 }
.bv { display: flex; flex-direction: column; gap: 18px; padding-top: 28px; max-width: 560px } .bv header { display: flex; flex-direction: column; gap: 8px } .bv h1 { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 800; letter-spacing: -.045em; line-height: 1.04 } .bv h1 em { font-style: normal; background: linear-gradient(120deg, var(--vi), var(--rs)); -webkit-background-clip: text; background-clip: text; color: transparent }
.bv-ops { display: flex; flex-direction: column; gap: 8px } .bv-ops .btn.cta { max-width: none; min-height: 60px } .bv-ops p { margin: 0 0 8px } .bv-ac { color: var(--muted); margin: 0 }
.conta-fim { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px } .conta-fim p { margin: 0 } .conta-fim .btn { min-height: 40px; padding: 8px 16px; font-size: .9rem; box-shadow: none }
.nano { padding: 14px 16px; gap: 6px } .ntop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px } .ntop b { font: 800 1.05rem var(--fd) }
.ntab { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed } .ntab th, .ntab td { padding: 10px 4px; text-align: left; vertical-align: middle; border-top: 1px solid var(--line) } .ntab thead th { border-top: 0; padding-block: 4px 6px; font: 700 .66rem var(--fd); letter-spacing: .03em; text-transform: uppercase; color: var(--muted) }
.ntab .num { text-align: right; width: 3rem; white-space: nowrap } .ntab thead th.num { letter-spacing: .03em } .ntab thead th:first-child { width: 40% } .ntab td.fin b { display: inline-block; min-width: 2.2em; text-align: center; padding: 3px 7px; border-radius: 9px; background: var(--cs); color: var(--c); font-weight: 800 }
.ntab tbody th { font-weight: 400 } .nmat { all: unset; cursor: pointer; font: 700 .92rem/1.25 var(--fb); color: var(--ink); overflow-wrap: break-word; hyphens: auto; min-height: 28px; display: block } .nmat:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; border-radius: 6px } .nmat::after { content: "▾"; color: var(--muted); margin-left: 6px; font-size: .8em } .nmat[aria-expanded=true]::after { content: "▴" }
.ntab .par span { display: inline-block; min-width: 1.9em; text-align: center; padding: 2px 5px; margin: 1px 3px 1px 0; border-radius: 7px; background: var(--sunk); font-weight: 600; font-size: .9rem } .ntab .par .vz { background: none; color: var(--muted) }
.ntab tr.det td { border-top: 0; padding: 0 4px 10px } .ntab tr.det ul { margin: 0; padding-left: 1.1em; font-size: .9rem; display: flex; flex-direction: column; gap: 4px }
.hoje, .retomar { display: flex; flex-direction: column; gap: 10px } .hoje { margin-top: 14px; gap: 14px } .retomar .btn.cta { max-width: none; margin-top: 0 }
.unit { padding-block: 26px 6px; display: flex; flex-direction: column; gap: 14px }
.unit-h { display: flex; flex-direction: column; gap: 4px } .unit-h h2 { font-size: 1.3rem; font-weight: 800 }
.note { border-left: 4px solid var(--am); background: var(--am-s); border-radius: 4px 14px 14px 4px; padding: 10px 14px; font-size: .92rem }
details.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-s) }
details.box > summary { cursor: pointer; padding: 14px 18px; font: 700 1rem var(--fd); color: var(--c); list-style: none; display: flex; gap: 10px; align-items: center }
details.box > summary::before { content: "▸"; transition: transform .2s } details.box[open] > summary::before { transform: rotate(90deg) }
details > summary::-webkit-details-marker { display: none }
.box-in { padding: 0 16px 16px }
.mmwrap { overflow-x: auto } .mm { min-width: 600px; width: 100%; height: auto; display: block }

/* tema */
.thead { padding-block: 20px 4px; display: flex; flex-direction: column; gap: 10px }
.thead .num { font: 800 .85rem var(--fd); color: var(--c) } .thead h1 { font-size: clamp(1.5rem, 4.4vw, 2.3rem); font-weight: 800; letter-spacing: -.03em }
.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; padding-block: 12px 10px }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.fig { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--sh); min-width: 0 }
.fig h3 { font-size: 1rem; font-weight: 800 } .fig svg.sv { width: 100%; height: auto; display: block; max-height: 70vh }
.fig .desc { background: var(--sunk); border-radius: 12px; padding: 10px 14px; font-size: .95rem } .fig .desc b { color: var(--c) }
.fig figcaption { font-size: .82rem; color: var(--muted) }
.prancha { position: relative; background: #fff; border-radius: 12px; overflow: hidden; line-height: 0 }
.prancha img { width: 100%; height: auto; display: block }
.prancha .vazio { line-height: 1.5; padding: 32px 16px; text-align: center; color: #5a5f7b; font-size: .9rem }
.prancha .pino { position: absolute; transform: translate(-50%, -50%); min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; border: 2px solid #fff; background: #14152e; color: #fff; font: 700 .78rem/22px var(--fd, inherit); text-align: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.45); transition: opacity .2s, background .2s }
.prancha .pino::after { content: ""; position: absolute; inset: -10px }
.prancha .pino.dim { opacity: .18 } .prancha .pino.sel { background: var(--c); transform: translate(-50%, -50%) scale(1.25); z-index: 2 }
.prancha .pino:focus-visible, .leg button:focus-visible { outline: 3px solid var(--c); outline-offset: 2px }
.leg { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px }
.leg button { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--sunk); color: var(--ink); border: 1px solid transparent; border-radius: 10px; padding: 6px 10px; font-size: .9rem; cursor: pointer }
.leg button.sel { border-color: var(--c) } .leg button.dim { opacity: .4 }
.leg .n { flex: none; min-width: 24px; height: 24px; border-radius: 12px; background: #14152e; color: #fff; font: 700 .75rem/24px var(--fd, inherit); text-align: center }
.leg .oculto { color: var(--muted); font-style: italic }
.fig .credito { font-size: .74rem; color: var(--muted) } .fig .credito a { color: inherit }
@media (prefers-reduced-motion: reduce) { .prancha .pino { transition: none } }
.cena { position: relative; border-radius: 16px; background: radial-gradient(120% 90% at 50% 20%, var(--surface), var(--sunk)); border: 1px solid var(--line); overflow: hidden; touch-action: pan-y; cursor: grab; min-height: 220px; user-select: none; -webkit-user-select: none }
.cena:active { cursor: grabbing } .cena:focus-visible { outline: 3px solid var(--c); outline-offset: 2px } .cena canvas { display: block; width: 100%; height: auto }
.cena .rot { position: absolute; transform: translate(-50%, -50%); font: 700 .7rem var(--fb); color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 2px 7px; border-radius: 999px; pointer-events: none; white-space: nowrap; box-shadow: var(--sh-s) }
.cena .rot.forte { font: 800 .64rem var(--fd); letter-spacing: .06em; background: transparent; border: 0; box-shadow: none; color: var(--muted) }
.cena .dica { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font: 600 .75rem var(--fb); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; pointer-events: none; white-space: nowrap }
.vistas { align-items: center } .vistas .k { font: 700 .72rem var(--fb); color: var(--muted); margin-right: 2px } .vistas button { min-height: 34px; padding: 6px 11px; font-size: .8rem }
.plana { margin: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
/* figura do paciente (corpo que muda por estado) e tabela comparativa com modo de teste */
.pac .pele { fill: var(--am-s); stroke: var(--am); stroke-width: 2.5; transition: transform .7s cubic-bezier(.3,1.25,.5,1), fill .6s, opacity .5s; transform-box: fill-box; transform-origin: center }
.pac .giba, .pac .estrias { opacity: 0; transition: opacity .5s } .pac .estrias path { stroke: var(--vi); stroke-width: 2.2; fill: none; stroke-linecap: round }
.pac[data-e="add"] .pele { fill: color-mix(in srgb, var(--am) 72%, var(--am-s)) }
.pac[data-e="cus"] .rosto { transform: scaleX(1.3) } .pac[data-e="cus"] .tronco { transform: scaleX(1.5) scaleY(1.03) } .pac[data-e="cus"] .braco.e { transform: translateX(-14px) scaleX(.6) } .pac[data-e="cus"] .braco.d { transform: translateX(14px) scaleX(.6) }
.pac[data-e="cus"] .perna { transform: scaleX(.62) } .pac[data-e="cus"] .giba, .pac[data-e="cus"] .estrias { opacity: 1 }
.pac .arco { fill: none; stroke: var(--line); stroke-width: 6; stroke-linecap: round } .pac .ag { stroke: var(--c); stroke-width: 4; stroke-linecap: round; transition: transform .7s cubic-bezier(.3,1.4,.5,1), opacity .4s }
.pac .dial .nvt { display: none; font-weight: 800 } .pac .dial.nv .ag { opacity: .12 } .pac .dial.nv .nvt { display: inline }
.pac .mk circle { fill: var(--ink) } .pac .mk text { fill: var(--surface); stroke: none; font: 800 11px var(--fd) } .pac .pele { vector-effect: non-scaling-stroke }
.pacleg { margin: 0; padding: 0; list-style: none; counter-reset: p; display: flex; flex-direction: column; gap: 6px; font-size: .92rem } .pacleg:empty { display: none }
.pacleg li { counter-increment: p; display: flex; gap: 9px; align-items: baseline } .pacleg li::before { content: counter(p); flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--surface); font: 800 .7rem/20px var(--fd); text-align: center }
.pacleg.um li::before { content: "→"; background: none; color: var(--c); font-size: 1rem }
.cmpw { overflow-x: auto } .cmp { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed } .cmp thead th { font: 800 .84rem var(--fd); text-align: center; padding-bottom: 2px }
.cmp tbody th { width: 24%; font: 700 .72rem/1.2 var(--fb); color: var(--muted); text-align: left; overflow-wrap: anywhere } .cmp td { padding: 0; height: 1px }
.cel { position: relative; width: 100%; height: 100%; min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 5px 3px; font: 600 .74rem/1.25 var(--fb); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; cursor: default; overflow-wrap: anywhere }
.cel.tx { font-size: .7rem; overflow-wrap: break-word } .cel b { font: 800 1.02rem/1 var(--fd) } .cel.up { background: var(--am-s) } .cel.up b { color: var(--am) } .cel.down { background: var(--bl-s) } .cel.down b { color: var(--bl) } .cel.eq { background: var(--sunk) }
.cel.na { color: var(--muted); border-style: dashed; background: transparent } .cel.cob { background: var(--c); border-color: var(--c); cursor: pointer } .cel.cob > * { visibility: hidden }
.cel.cob::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--on); font: 800 1.1rem var(--fd) }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap } .dia { width: 100%; accent-color: var(--c); height: 34px; margin: 0 } .sinal { offset-distance: 0% } @keyframes anda { to { offset-distance: 100% } }
@media (prefers-reduced-motion: no-preference) { .sinal { animation: anda 3.4s linear infinite } }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.seg button { font: 600 .85rem var(--fb); border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 999px; cursor: pointer; min-height: 38px }
.seg button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on) }
.seg button.plus[aria-pressed="true"] { background: var(--gr); border-color: var(--gr) } .seg button.minus[aria-pressed="true"] { background: var(--rd); border-color: var(--rd) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--sh-s); display: flex; flex-direction: column; gap: 12px; position: relative; min-width: 0 }
.card.rail::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: var(--c) }
.ct { font: 800 .74rem var(--fd); letter-spacing: .08em; text-transform: uppercase; color: var(--c) }
.card h3 { font-size: 1rem; font-weight: 800; margin-top: 4px } .card ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px }
.key { background: var(--cs); border-left: 4px solid var(--c); border-radius: 4px 14px 14px 4px; padding: 12px 14px; font-weight: 600 }
.memo { background: linear-gradient(160deg, var(--cs), var(--surface) 80%); border: 1.5px solid color-mix(in srgb, var(--c) 40%, transparent) }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px }
.chain span { background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: .88rem; padding: 4px 10px; border-radius: 8px }
.chain .ar { background: none; border: 0; color: var(--c); padding: 0 } .chain .p { background: var(--gr-s); border-color: var(--gr); color: var(--gr) } .chain .m { background: var(--rd-s); border-color: var(--rd); color: var(--rd) }
.chain .lb { background: none; border: 0; padding: 0; color: var(--muted); font-weight: 600 }
textarea.ta { width: 100%; font: inherit; font-size: .98rem; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; resize: vertical; min-height: 64px }
.hints { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px } .hints li { background: var(--cs); border-radius: 12px; padding: 8px 12px }
.ans { background: var(--gr-s); border-left: 4px solid var(--gr); border-radius: 4px 14px 14px 4px; padding: 12px 14px }
.qz { display: flex; flex-direction: column; gap: 8px } .qz + .qz { border-top: 1px dashed var(--line); padding-top: 14px }
.lv { align-self: flex-start; font: 800 .68rem var(--fd); letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; background: var(--bl-s); color: var(--bl) } .lv.d { background: var(--am-s); color: var(--am) }
.qq { font-weight: 700; line-height: 1.35 }
.qo { text-align: left; font: 600 .95rem var(--fb); background: var(--sunk); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; cursor: pointer; line-height: 1.35; width: 100% }
.qo:disabled { cursor: default } .qo.good { background: var(--gr-s); border-color: var(--gr) } .qo.bad { background: var(--rd-s); border-color: var(--rd) }
.qe { font-size: .93rem; background: var(--sunk); border-radius: 12px; padding: 9px 12px }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 18px; margin: 0; font-size: .95rem }
.terms div { display: flex; flex-direction: column; padding: 6px 0; border-bottom: 1px solid var(--line) } .terms dt { color: var(--muted); font-size: .85rem } .terms dd { margin: 0; font-weight: 700; color: var(--c) }
.mistake { background: var(--rd-s); border-left: 4px solid var(--rd); border-radius: 4px 14px 14px 4px; padding: 10px 14px; font-size: .95rem }
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px }
.mini { perspective: 900px; cursor: pointer; display: grid; min-height: 140px; background: none; border: 0; padding: 0; text-align: left; font: inherit }
.mini .in { display: grid; transform-style: preserve-3d; transition: transform .45s } .mini.flip .in { transform: rotateY(180deg) }
.mini .f, .mini .bk { grid-area: 1/1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; justify-content: center; gap: 6px; border: 1px solid var(--line); min-height: 140px; box-shadow: var(--sh-s) }
.mini .f { background: var(--surface); font-weight: 700 } .mini .f small { font-weight: 600; color: var(--muted); font-size: .76rem }
.mini .bk { background: var(--cs); border-color: var(--c); transform: rotateY(180deg); font-size: .92rem }
.flag { color: var(--am); background: var(--am-s); border-radius: 6px; padding: 1px 7px; font-weight: 800; font-size: .82rem }
.tfoot { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; padding-block: 18px 30px }

/* joinha e comentários */
.fb { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px }
.fbb { font-size: 1.05rem; min-width: 44px; min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer }
.fbb[aria-pressed="true"] { background: var(--cs); border-color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c) }
.fbbox { display: flex; flex-direction: column; gap: 8px }

/* medidores */
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 10px; align-items: end }
.meter { display: flex; flex-direction: column; gap: 5px; align-items: center; text-align: center; font-size: .8rem; font-weight: 700; min-width: 0 }
.meter .tube { width: 100%; max-width: 62px; height: 120px; border-radius: 14px; background: var(--sunk); display: flex; align-items: flex-end; overflow: hidden; border: 1px solid var(--line) }
.meter .lvl { width: 100%; height: 50%; background: var(--c); transition: height .7s cubic-bezier(.3,1.4,.5,1) }
.meter .v { font: 800 .82rem var(--fd); color: var(--c) }
.gauge { height: 18px; border-radius: 99px; background: linear-gradient(90deg, var(--rd-s), var(--sunk) 50%, var(--gr-s)); position: relative; border: 1px solid var(--line) }
.gauge i { position: absolute; top: -5px; width: 8px; height: 26px; border-radius: 4px; background: var(--ink); transform: translateX(-50%); transition: left .5s cubic-bezier(.3,1.4,.5,1) }
.gl { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; color: var(--muted) }
.refl { background: var(--sunk); border-radius: 14px; padding: 12px 14px } .refl summary { cursor: pointer; font-weight: 700; font-size: .95rem } .refl p { margin-top: 6px; font-size: .93rem }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); font-weight: 600 } .legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block }

/* vocabulário das figuras */
.sv text { font-family: var(--fb); font-size: 12.5px; font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round }
.sv .mut { fill: var(--muted); font-weight: 600; font-size: 11.5px } .sv .cap { font-size: 11px; letter-spacing: .06em }
.sv .on-c { fill: var(--on); stroke: none } .sv .t-gr { fill: var(--gr) } .sv .t-rd { fill: var(--rd) } .sv .t-c { fill: var(--c) }
.f-vi { fill: var(--vi-s); stroke: var(--vi); stroke-width: 2.5 } .f-am { fill: var(--am-s); stroke: var(--am); stroke-width: 2.5 } .f-rs { fill: var(--rs-s); stroke: var(--rs); stroke-width: 2.5 }
.f-bl { fill: var(--bl-s); stroke: var(--bl); stroke-width: 2.5 } .f-gr { fill: var(--gr-s); stroke: var(--gr); stroke-width: 2.5 } .f-rd { fill: var(--rd-s); stroke: var(--rd); stroke-width: 2.5 }
.f-sur { fill: var(--surface); stroke: var(--line); stroke-width: 2 } .f-sunk { fill: var(--sunk); stroke: var(--line); stroke-width: 2 }
.s-vi { fill: var(--vi) } .s-am { fill: var(--am) } .s-rs { fill: var(--rs) } .s-bl { fill: var(--bl) } .s-gr { fill: var(--gr) } .s-rd { fill: var(--rd) } .s-ink { fill: var(--ink) } .s-mut { fill: var(--muted) }
.ln { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round }
.k-vi { stroke: var(--vi) } .k-am { stroke: var(--am) } .k-rs { stroke: var(--rs) } .k-bl { stroke: var(--bl) } .k-gr { stroke: var(--gr) } .k-rd { stroke: var(--rd) } .k-ink { stroke: var(--ink) } .k-mut { stroke: var(--muted) }
.flow { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite } @keyframes dash { to { stroke-dashoffset: -28 } }
.sv [data-on] { transition: opacity .3s } .sv .dim { opacity: .14 }
.mm-e { fill: none; stroke-width: 2; opacity: .75 } .mm text { stroke: none }
.mm .c0 { fill: var(--c); } .mm .t0 { fill: var(--on); font-size: 13.5px } .mm .lf { font-weight: 600; font-size: 12px }

/* cartões */
.deck { max-width: 760px; margin: 0 auto; padding-block: 24px 30px; display: flex; flex-direction: column; gap: 14px }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { font: 600 .86rem var(--fb); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; min-height: 38px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.fc { min-height: 300px; justify-content: space-between; border-radius: 24px; padding: 24px; box-shadow: var(--sh) }
.fc .q { font: 700 clamp(1.15rem, 3.6vw, 1.5rem)/1.3 var(--fd) } .fc .a { border-top: 1px dashed var(--line); padding-top: 12px; font-size: 1.05rem }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px } .two .full { grid-column: 1/-1 } .two .btn { justify-content: center }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px } .stat { background: var(--sunk); border-radius: 14px; padding: 10px 12px; min-width: 0 }
.stat b { display: block; font: 800 1.5rem var(--fd); font-variant-numeric: tabular-nums } .stat span { font-size: .8rem; color: var(--muted) }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding-block: 26px 40px; max-width: 70ch; margin: 0 auto }

/* abas e "ver mais" (v13): abas curtas numa linha, coladas no conteúdo, fixas sob a barra; o resto da página recolhido */
.abas { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 57px)); z-index: 15; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); margin-top: 14px; border-bottom: 1px solid var(--line) }
.abas [role="tablist"] { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity }
.abas [role="tablist"]::-webkit-scrollbar { display: none }
.aba { flex: 1 0 auto; scroll-snap-align: start; font: 700 .9rem var(--fd); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 8px 10px; min-height: 48px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; justify-content: center }
.aba small { font: 800 .7rem var(--fd); background: var(--sunk); color: var(--muted); border-radius: 99px; padding: 2px 7px }
.aba[aria-selected="true"] { color: var(--c); border-bottom-color: var(--c); font-weight: 800 }
.aba[aria-selected="true"] small { background: var(--cs); color: var(--c) }
.aba:hover { color: var(--ink) } .aba:focus-visible { outline-offset: -3px }
.painel { padding-block: 18px 6px; display: flex; flex-direction: column; gap: 16px; animation: entra .18s ease-out }
.painel:focus { outline: none }
.painel[hidden], .abas-wrap [hidden] { display: none !important }
@keyframes entra { from { opacity: .3; transform: translateY(4px) } to { opacity: 1; transform: none } }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; align-items: start }
.vmais { align-self: flex-start; font: 700 .9rem var(--fb); color: var(--c); background: var(--cs); border: 0; border-radius: 999px; padding: 10px 16px; min-height: 44px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center }
.vmais::after { content: "▾" } .vmais[aria-expanded="true"]::after { content: "▴" }
.resto { display: contents } .resto[hidden] { display: none }
.plhead { display: flex; align-items: center; gap: 12px; margin-top: 14px } .plhead .track { flex: 1; margin: 0 }
.plhead b { font: 800 .95rem var(--fd); white-space: nowrap; font-variant-numeric: tabular-nums }
.tlist { display: flex; flex-direction: column; gap: 8px }
.trow { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 6px 16px 16px 6px; padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; box-shadow: var(--sh-s); min-height: 56px }
.trow:hover { border-color: var(--c) } .trow .num { font: 800 .8rem var(--fd); color: var(--c) }
.trow .tt { display: block; font: 700 1rem/1.25 var(--fd) } .trow .ts { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: .86rem; color: var(--muted); line-height: 1.35; margin-top: 2px }
.trow .badge { display: inline-block; margin-top: 6px; white-space: nowrap }
.trow.pend { border-left-color: var(--line); border-style: dashed; box-shadow: none; background: transparent; cursor: default; grid-template-columns: minmax(0, 1fr) auto }
details.mini-sec { border-top: 1px solid var(--line); padding-top: 4px }
details.mini-sec > summary { cursor: pointer; list-style: none; font: 700 1rem var(--fd); padding: 12px 0; display: flex; gap: 10px; align-items: center; min-height: 44px }
details.mini-sec > summary::before { content: "▸"; color: var(--c); transition: transform .2s } details.mini-sec[open] > summary::before { transform: rotate(90deg) }
details.mini-sec > summary small { font: 600 .85rem var(--fb); color: var(--muted) }
details.mini-sec > .in { padding-bottom: 12px; display: flex; flex-direction: column; gap: 12px }
.tfb { padding-top: 18px }
/* online na versão pública: contador para todos; a administradora abre a caixa e vê os nomes */
.onl { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; font-size: .88rem; font-weight: 600; max-width: 100% }
.onl > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 14px; min-height: 40px }
.onl > summary::after { content: "▾"; color: var(--muted) } .onl[open] > summary::after { content: "▴" }
.onl ul { list-style: none; margin: 0; padding: 0 14px 10px; display: flex; flex-direction: column; gap: 6px }
.onl li { display: flex; align-items: center; gap: 8px } .onl li small { color: var(--muted); font-weight: 500 }
.onl .dot, .online .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gr); flex: 0 0 auto }
.conta { display: flex; flex-direction: column; gap: 10px; margin-top: 16px }
.anoh { display: flex; flex-direction: column; gap: 10px } .anoh .top { display: flex; justify-content: space-between; align-items: center; gap: 10px } .anoh .top .pill { min-width: 44px; min-height: 40px; font-weight: 800 }
.grow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line) } .grow select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 40px }
.linkb { background: none; border: 0; padding: 0; font: inherit; color: var(--c, var(--vi)); text-decoration: underline; cursor: pointer }
.priv h2 { font-size: 1.5rem; font-weight: 800 } .priv ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px }
/* opções da matéria */
.tw { position: relative; display: grid } .tw > .tile { width: 100% }
.tmenu { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 800 1.1rem var(--fd); cursor: pointer; z-index: 1 }
.badge.ok { background: var(--gr-s); color: var(--gr) } .estrela { color: var(--am) } .tile .tt { padding-right: 44px } .sheet .fav { font-weight: 700 !important }
.fundo { position: fixed; inset: 0; z-index: 50; background: rgba(10, 10, 25, .5); display: flex; align-items: flex-end; justify-content: center }
.sheet { --c: var(--vi); --cs: var(--vi-s); font-family: var(--fb); background: var(--bg); color: var(--ink); width: min(600px, 100%); max-height: 92vh; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; box-shadow: var(--sh); overflow: hidden }
.sh-head { padding: 8px 20px 14px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px }
.sh-grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 4px }
.sh-head h2 { font: 800 1.3rem/1.2 var(--fd); margin: 0 }
.sh-sub { display: flex; gap: 6px; flex-wrap: wrap } .shchip { font: 600 .76rem/1 var(--fb); padding: 6px 10px; border-radius: 999px; background: var(--cs); color: var(--c) }
.sh-body { overflow: auto; padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 22px; flex: 1 1 auto; overscroll-behavior: contain }
.sh-foot { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line) }
.sh-foot .btn { flex: 1 1 140px; justify-content: center; min-height: 48px } .sh-foot .btn.ghost { flex-basis: 100%; min-height: 40px }
.sh-body > * { flex-shrink: 0 } .sec { display: flex; flex-direction: column; gap: 8px } .sec > .lb { font: 700 .72rem var(--fb); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 0 4px }
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column } .grp > * + * { border-top: 1px solid var(--line) }
.opt { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 8px 16px; cursor: pointer; font: 500 1rem/1.3 var(--fb); color: var(--ink) }
.opt .t { flex: 1; min-width: 0 } .opt .t small { display: block; font: 500 .8rem var(--fb); color: var(--muted); margin-top: 2px }
.opt input[type=radio] { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-content: center; flex: 0 0 auto; margin: 0; order: -1; background: transparent; cursor: pointer }
.opt input[type=radio]::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); transform: scale(0); transition: transform .12s }
.opt input[type=radio]:checked { border-color: var(--c) } .opt input[type=radio]:checked::after { transform: scale(1) } .opt:has(input[type=radio]:checked) { background: var(--cs) }
.sw { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 30px; background: var(--line); position: relative; flex: 0 0 auto; cursor: pointer; margin: 0; transition: background .15s }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s }
.sw:checked { background: var(--c) } .sw:checked::after { transform: translateX(20px) }
.fld { display: flex; flex-direction: column; gap: 3px; padding: 10px 16px; min-height: 58px; justify-content: center; cursor: text } .fld > span { font: 600 .76rem var(--fb); color: var(--muted) } .fld:focus-within { background: var(--cs) }

/* ===== mapa mental gerado dos dados: { c: centro, r: [{ t: ramo, f: [folhas] }] } ===== */

  let y = 10; const rows = tree.r.map((b, i) => { const n = Math.max(1, b.f.length), h = n * LH; const o = { b, i, y0: y, cy: y + h / 2 }; y += h + PAD; return o; });

  let s = `<svg class="sv mm" viewBox="0 0 640 ${H}" role="img" aria-label="${T("Mapa mental", "Mapa mental")}: ${tree.c.replace("|", " ")}">`;
  rows.forEach(r => { const hue = HUES[r.i % 5];
    s += `<path class="mm-e k-${hue}" d="M${8 + cw} ${cy} C${bx - 30} ${cy} ${bx - 34} ${r.cy} ${bx} ${r.cy}"/>`;
    r.b.f.forEach((f, j) => { const fy = r.y0 + j * LH + LH / 2; s += `<path class="mm-e k-${hue}" d="M${bx + bw} ${r.cy} C${lx - 18} ${r.cy} ${lx - 22} ${fy} ${lx - 6} ${fy}"/><circle cx="${lx - 4}" cy="${fy}" r="3.5" class="s-${hue}"/><text class="lf" x="${lx + 6}" y="${fy + 4}">${f}</text>`; });
    s += `<rect class="f-${hue}" x="${bx}" y="${r.cy - 14}" width="${bw}" height="28" rx="14"/><text x="${bx + bw / 2}" y="${r.cy + 4.5}" text-anchor="middle">${r.b.t}</text>`; });
  const lines = tree.c.split("|");

  return el("div", { class: "mmwrap", html: s + "</svg>" });
}

function temProgresso(x) { return !!x && (Object.values(x.cards || {}).some(c => c && (c.flag || c.streak)) || Object.values(x.rev || {}).some(Boolean) || Object.keys(x.quiz || {}).length > 0); }
function ligarNuvem() {
  const vai = () => { const N = window.NUVEM; if (!N || CAP.nuvem) return; CAP.nuvem = N;
    N.onUser(async u => { CAP.conta = u; CAP.nuvemPronta = false;
      if (u && !u.anon) { try { const d = await N.ler();
          /* a nuvem vence quando este aparelho está vazio, ou quando ela é mais nova */
          if (d && typeof d.json === "string") { const r = JSON.parse(d.json);
            if (r && r.cards && (!temProgresso(S) || (temProgresso(r) && (d.ts || 0) > (S.ts || 0)))) { const lang = S.lang; S = Object.assign(S, r); S.lang = lang; S.plano = null; migrarCartoes(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} } }
          CAP.nuvemPronta = true; CAP.nuvemErro = false; save(); } catch (e) { CAP.nuvemErro = true; } }
      presenca(); render(); renderOnline(); });
    N.onOnline(o => { CAP.online = o; renderOnline(); });
    if (querEntrar) { querEntrar = false; N.entrar().catch(() => {}); } };
  if (window.NUVEM) vai(); else addEventListener("nuvem", vai, { once: true });
}
